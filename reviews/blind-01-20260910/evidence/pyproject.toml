[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[project]
name = "polar-activity-counter"
version = "0.1.0"
description = "Windows Verity Sense IMU acquisition and labelled dataset collector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["polar-python==1.1.1", "bleak==3.0.2", "numpy==2.4.6", "matplotlib==3.11.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.6"]
usb = ["hidapi==0.15.0"]

[project.scripts]
polar-activity = "polar_activity.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/polar_activity"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

