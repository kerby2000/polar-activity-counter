name: Checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,experiment]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python -m pip check
      - name: Try the documented hardware-free workflow
        run: |
          python scripts/make_synthetic_session.py data/raw/synthetic-demo
          python -m polar_activity diagnose data/raw/synthetic-demo
          python -m polar_activity plot data/raw/synthetic-demo
          python -m polar_activity count data/raw/synthetic-demo
